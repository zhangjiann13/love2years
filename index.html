<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的周年 · 幸运抽奖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #fff0f4, #fef6fb);
      font-family: "Noto Sans SC", system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 180, 200, 0.35);
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(220, 120, 150, 0.14);
    }
    .wheel-wrap {
      position: relative;
      width: min(90vw, 340px);
      height: min(90vw, 340px);
      margin: 0 auto;
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      box-shadow: 0 0 0 8px #ffb6c9;
    }
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 56px solid #e65b84;
      z-index: 10;
    }
    .center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7a9f, #d64c75);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(214, 76, 117, 0.35);
      z-index: 5;
    }
    .center-btn:active {
      transform: translate(-50%, -50%) scale(0.94);
    }
    .center-btn:disabled {
      background: #c8c8c8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .heart {
      position: fixed;
      color: #ff8fb3;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 0;
    }
    @keyframes fall {
      0% {
        top: -30px;
        opacity: 0.6;
        transform: rotate(0deg);
      }
      100% {
        top: 110vh;
        opacity: 0;
        transform: rotate(360deg);
      }
    }
    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div id="hearts"></div>
  <div class="max-w-xl mx-auto relative z-10">
    <div class="glass p-7 text-center">
      <h1 class="text-2xl text-rose-500 font-bold mb-2">我们的周年纪念 ♥</h1>
      <p class="text-rose-400 text-sm mb-6">始于 2024‑11‑07</p>

      <div class="flex justify-center flex-wrap gap-3 mb-8">
        <div class="px-4 py-3 rounded-2xl bg-rose-100/60">
          <div id="day" class="text-xl font-bold text-rose-500">0</div>
          <div class="text-xs text-rose-400">天</div>
        </div>
        <div class="px-4 py-3 rounded-2xl bg-rose-100/60">
          <div id="hour" class="text-xl font-bold text-rose-500">0</div>
          <div class="text-xs text-rose-400">时</div>
        </div>
        <div class="px-4 py-3 rounded-2xl bg-rose-100/60">
          <div id="min" class="text-xl font-bold text-rose-500">0</div>
          <div class="text-xs text-rose-400">分</div>
        </div>
        <div class="px-4 py-3 rounded-2xl bg-rose-100/60">
          <div id="sec" class="text-xl font-bold text-rose-500">0</div>
          <div class="text-xs text-rose-400">秒</div>
        </div>
      </div>

      <div class="wheel-wrap mb-6">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <button class="center-btn" id="spinBtn">抽</button>
      </div>

      <div class="min-h-[64px] flex items-center justify-center">
        <p id="resultText" class="text-lg text-rose-500 font-medium"></p>
      </div>

      <div class="mt-6 pt-6 border-t border-rose-200/60 text-sm text-rose-400">
        <p>每份礼物只有一份，抽走就不会再出现啦</p>
      </div>
    </div>
  </div>

  <canvas class="confetti" id="confetti"></canvas>

  <script>
    const startDate = new Date("2024-11-07 00:00:00");
    const allPrizes = [
      "戒指",
      "香囊",
      "card",
      "神秘大奖",
      "手写信",
      "我的亲亲",
      "我的抱抱"
    ];
    const colorPool = ["#ffd6e0", "#ffe4ef", "#ffc8da", "#ffb6c9", "#ffdce5", "#ffcedb", "#ffd1dc"];

    function loadState() {
      const saved = localStorage.getItem("anniversaryWheelTaken");
      if (saved) {
        return JSON.parse(saved);
      }
      return [];
    }
    function saveState(taken) {
      localStorage.setItem("anniversaryWheelTaken", JSON.stringify(taken));
    }

    let takenPrizes = loadState();
    let remainPrizes = allPrizes.filter(p => !takenPrizes.includes(p));

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;
      if (diff <= 0) return;
      const totalSec = Math.floor(diff / 1000);
      const day = Math.floor(totalSec / 86400);
      const hour = Math.floor((totalSec % 86400) / 3600);
      const min = Math.floor((totalSec % 3600) / 60);
      const sec = totalSec % 60;
      document.getElementById("day").textContent = day;
      document.getElementById("hour").textContent = hour;
      document.getElementById("min").textContent = min;
      document.getElementById("sec").textContent = sec;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const size = Math.min(340, window.innerWidth * 0.9);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    ctx.scale(dpr, dpr);
    const r = size / 2;

    function drawWheel() {
      ctx.clearRect(0, 0, size, size);
      const n = remainPrizes.length;
      if (n === 0) return;
      const sectorAngle = (Math.PI * 2) / n;
      for (let i = 0; i < n; i++) {
        ctx.beginPath();
        ctx.moveTo(r, r);
        ctx.arc(r, r, r, sectorAngle * i, sectorAngle * (i + 1));
        ctx.closePath();
        ctx.fillStyle = colorPool[i % colorPool.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    let spinning = false;
    let deg = 0;
    const spinBtn = document.getElementById("spinBtn");
    const resultText = document.getElementById("resultText");

    function refreshUI() {
      remainPrizes = allPrizes.filter(p => !takenPrizes.includes(p));
      drawWheel();
      if (remainPrizes.length === 0) {
        spinBtn.disabled = true;
        spinBtn.innerText = "全部抽完";
      } else {
        spinBtn.disabled = false;
        spinBtn.innerText = "抽";
      }
    }

    spinBtn.onclick = function () {
      if (spinning || remainPrizes.length === 0) return;
      spinning = true;
      resultText.textContent = "";

      const n = remainPrizes.length;
      const extraRotate = 360 * (5 + Math.random() * 4);
      deg += extraRotate;
      canvas.style.transform = `rotate(${deg}deg)`;

      setTimeout(() => {
        spinning = false;
        const mod = deg % 360;
        const per = 360 / n;
        const raw = (360 - mod + per / 2) % 360;
        const idx = Math.floor(raw / per);
        const prize = remainPrizes[idx];

        takenPrizes.push(prize);
        saveState(takenPrizes);
        refreshUI();

        resultText.textContent = `🎉 恭喜抽到：${prize}`;
        fireConfetti();
      }, 4000);
    };

    function addHeart() {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerText = "♥";
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (12 + Math.random() * 20) + "px";
      h.style.animationDuration = (5 + Math.random() * 7) + "s";
      document.getElementById("hearts").appendChild(h);
      setTimeout(() => h.remove(), 13000);
    }
    setInterval(addHeart, 500);

    function fireConfetti() {
      const c = document.getElementById("confetti");
      const cctx = c.getContext("2d");
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      window.addEventListener("resize", () => {
        c.width = innerWidth;
        c.height = innerHeight;
      });
      const particles = [];
      for (let i = 0; i < 200; i++) {
        particles.push({
          x: Math.random() * c.width,
          y: Math.random() * -c.height,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 4 + 2,
          r: Math.random() * 6 + 2,
          color: ["#ff7a9f", "#ffd1dc", "#fff", "#ffb6c9"][Math.floor(Math.random() * 4)]
        });
      }
      function draw() {
        cctx.clearRect(0, 0, c.width, c.height);
        for (let p of particles) {
          cctx.beginPath();
          cctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          cctx.fillStyle = p.color;
          cctx.fill();
          p.x += p.vx;
          p.y += p.vy;
        }
        requestAnimationFrame(draw);
      }
      draw();
      setTimeout(() => {
        cctx.clearRect(0, 0, c.width, c.height);
      }, 4200);
    }

    refreshUI();
  </script>
</body>
</html>
